          <th style="color:rgba(255,204,68,.7)">${T('pg.nish')}</th>
          <th style="color:rgba(255,153,170,.7)">${T('pg.combined')}</th></tr>
          ${sortedDig.map(({planet,sign,dig,nish,total})=>{
            const el=SIGN_ELEMENT[sign];
            const dPct=Math.round(dig/maxDig*100);
            const nPct=Math.round(nish/maxNish*100);
            const tPct=Math.round(total/maxTotal*100);
            return `<tr><td>${pBadge(planet)}</td>
              <td><span class="el-${el}">${SN(sign)}</span></td>
              <td style="font-size:8.5px;color:rgba(200,195,175,.55)">${I18N.term('dig_info',planet)||'—'}</td>
              <td><div style="display:flex;align-items:center;gap:3px">${buildBar(dPct,BC.dig,'5px')}<span style="color:#ff99aa;font-size:9px;min-width:22px">${dig}</span></div></td>
              <td><div style="display:flex;align-items:center;gap:3px">${buildBar(nPct,BC.total,'5px')}<span style="color:#ffcc44;font-size:9px;min-width:22px">${nish}</span></div></td>
              <td><div style="display:flex;align-items:center;gap:3px">${buildBar(tPct,BC.stana,'5px')}<span style="color:#55ccff;font-size:9px;min-width:22px">${total}</span></div></td>
            </tr>`;
          }).join('')}
        </table>
        <div style="margin-top:10px;font-size:9px;color:rgba(200,195,175,.4)">${T('pg.dig_note')}</div>
      </div>`;
    } // end dig else block

    // ── DRIK BALA TAB ──
    // Added here; chart_playground.html has no equivalent. See computeDrikBala.
    const placedMap={};
    for(let pos=0;pos<16;pos++){
      if(!GRID_SIGNS[pos]) continue;
      (cellPlanets[pos]||[]).forEach(p=>{if(p!=='Asc') placedMap[p]=GRID_SIGNS[pos];});
    }
    const ascSign=ascSIdx!==-1?SIGNS[ascSIdx]:null;
    if(ascSign) placedMap.Asc=ascSign;
    const drikMap=computeDrikBala(placedMap);
    const drikRows=Object.keys(drikMap).map(planet=>({planet,...drikMap[planet]}));
    const sortedDrik=[...drikRows].sort((a,b)=>b.score-a.score);
    if(!sortedDrik.length){sec('drik').innerHTML=noData;}
    else{
    const srcList=(arr,sign)=>arr.length
      ? arr.map(x=>`${pBadge(x.src)}<span style="font-size:8.5px;color:rgba(200,195,175,.5)">${sign}${Math.round(x.pts)}</span>`).join(' ')
      : '<span style="color:rgba(200,195,175,.3)">&mdash;</span>';
    sec('drik').innerHTML=
      `<div class="dash-section" style="grid-column:1/-1"><h3 class="drik-h3">&#9673; ${T('pg.drik_title')}</h3>
        <table class="signs-table"><tr>
          <th style="color:rgba(255,204,68,.7)">${T('pg.planet')}</th>
          <th style="color:rgba(68,221,136,.7)">${T('pg.drik_benefics')}</th>
          <th style="color:rgba(255,102,85,.7)">${T('pg.drik_malefics')}</th>
          <th style="color:rgba(204,136,255,.7)">${T('pg.drik_net')}</th>
          <th style="color:rgba(85,204,255,.7)">${T('pg.drik_score')}</th></tr>
          ${sortedDrik.map(({planet,score,raw,good,bad})=>{
            const netColor=raw>0?'#44ff88':raw<0?'#ff6655':'rgba(200,195,175,.5)';
            return `<tr><td>${pBadge(planet)}</td>
              <td>${srcList(good,'+')}</td>
              <td>${srcList(bad,'-')}</td>
              <td style="color:${netColor};font-size:9px">${raw>0?'+':''}${raw}</td>
              <td><div style="display:flex;align-items:center;gap:3px">${buildBar(score,score>=50?BC.good:BC.bad,'5px')}<span style="color:#55ccff;font-size:9px;min-width:22px">${score}</span></div></td>
            </tr>`;
          }).join('')}
        </table>
        <div style="margin-top:10px;font-size:9px;color:rgba(200,195,175,.4)">${T('pg.drik_note')}</div>
      </div>`;
    }

    // ── TOTAL STRENGTH TAB ──
    // Combine: Subathuva wellness (normalized) + Stana Bala + Dig+Nish + Drik Bala.
    // Weight: 35% Subathuva + 30% Stana + 20% Dig+Nish + 15% Drik (was
    // 40/35/25 in chart_playground.html, which has no Drik Bala).
    const stanaArr=typeof stana!=='undefined'&&Array.isArray(stana)?stana:[];
    const digNishArr=typeof digNish!=='undefined'&&Array.isArray(digNish)?digNish:[];
    const allPlanets=[...new Set([...stanaArr.map(s=>s.planet),...digNishArr.map(d=>d.planet),...Object.keys(pScores)])];
    const totalScores=allPlanets.map(planet=>{
      const sub=pScores[planet];
      const subW=sub?(sub.wellness)/(Math.max(...Object.values(pScores).map(s=>Math.abs(s.wellness)),1)):0;
      const stanaEntries=stanaArr.filter(s=>s.planet===planet);
      const stanaAvg=stanaEntries.length?stanaEntries.reduce((a,b)=>a+b.score,0)/stanaEntries.length:30;
      const digEntries=digNishArr.filter(d=>d.planet===planet);
      const digAvg=digEntries.length?digEntries.reduce((a,b)=>a+b.total,0)/digEntries.length:0;
      const drikScore=drikMap[planet]?drikMap[planet].score:50;
      const total=Math.round(subW*35+stanaAvg*0.30+digAvg*0.20+drikScore*0.15);
      const subWellStr=sub?`${sub.wellness>=0?'+':''}${Math.round(sub.wellness)}`:'-';
      const stanaLabel=stanaEntries.map(s=>I18N.term('stana_label',s.label)).join(', ')||'—';
      return{planet,subWell:sub?sub.wellness:0,stana:Math.round(stanaAvg),dig:Math.round(digAvg),drik:drikScore,total,subWellStr,stanaLabel};
    });
    lastScores={stana:stanaArr,digNish:digNishArr,pScores,drik:drikMap,total:totalScores};
    if(typeof opts.onScores==='function') opts.onScores(lastScores);
    const sortedTotal=[...totalScores].sort((a,b)=>b.total-a.total);
    const maxT=Math.max(...sortedTotal.map(s=>Math.abs(s.total)),1);
    sec('total').innerHTML=
      `<div class="dash-section" style="grid-column:1/-1"><h3 class="total-h3">⊛ ${T('pg.combined_strength')}</h3>
        <table class="signs-table"><tr>
          <th style="color:rgba(255,204,68,.7)">${T('pg.planet')}</th>
          <th style="color:rgba(204,136,255,.7)">${T('pg.subathuva')}</th>
          <th style="color:rgba(85,204,255,.7)">${T('pg.stana_bala')}</th>
          <th style="color:rgba(255,153,170,.7)">${T('pg.dig_nish')}</th>
          <th style="color:rgba(204,136,255,.7)">${T('pg.drik_score')}</th>
          <th style="color:rgba(255,204,68,.7)">${T('pg.total_strength')}</th></tr>
          ${sortedTotal.map(({planet,subWellStr,stana:stS,dig:dg,drik:dk,total,stanaLabel})=>{
            const isPos=total>=0;
            const pct=Math.round(Math.abs(total)/maxT*100);
            const tColor=isPos?'#ffcc44':'#ff6655';
            const tBg=isPos?BC.total:BC.bad;
            return `<tr><td style="padding:4px">${pBadge(planet)}</td>
              <td style="padding:4px"><span style="color:${parseFloat(subWellStr)>=0?'#44ff88':'#ff6655'};font-size:10px;font-weight:700">${subWellStr}</span></td>
              <td style="padding:4px"><div style="display:flex;flex-direction:column;gap:1px"><span style="color:#55ccff;font-size:10px;font-weight:700">${stS}</span><span style="font-size:8px;color:rgba(200,195,175,.45)">${stanaLabel}</span></div></td>
              <td style="padding:4px"><span style="color:#ff99aa;font-size:10px;font-weight:700">${dg}</span></td>
              <td style="padding:4px"><span style="color:#cc88ff;font-size:10px;font-weight:700">${dk}</span></td>
              <td style="padding:4px"><div style="display:flex;align-items:center;gap:5px">
                ${buildBar(pct,tBg,'8px')}
                <span style="font-size:11px;font-weight:700;color:${tColor};min-width:32px">${total>0?'+'+total:total}</span>
              </div></td></tr>`;
          }).join('')}
        </table>
        <div style="margin-top:10px;font-size:9px;color:rgba(200,195,175,.4)">${T('pg.total_note')}</div>
      </div>`;

    // ── SIGN COLORS TAB ──
    updateSignColorsDashboard();

    // ── CONNECTIONS TAB ──
    renderConnections();
  }

  // ═══════════════════════════════════════════════════
  //  CONNECTION CHECKS
  // ═══════════════════════════════════════════════════
  const ORD=(n)=>I18N.ordinal(n);
  // Sign index of house n, counted from the Ascendant.
  function houseSign(ascSIdx,n){return (ascSIdx+n-1)%12;}
  // Signs a planet aspects from where it sits, each with its aspect number
  // (5th, 7th...). Its own sign is presence, not aspect, so it is left out.
  function aspectsFrom(planet,sIdx,sunSIdx){
    return getAspectOffsets(planet,sIdx,sunSIdx).filter(off=>off!==1).map(off=>({off,sIdx:aspectSign(sIdx,off)}));
  }

  // House h's sign, its lord, and where that lord sits - all the link checks read.
  function houseInfo(ascSIdx,h){
    const sIdx=houseSign(ascSIdx,h);
    const lord=SIGN_LORD[SIGNS[sIdx]];
    return {h,sIdx,lord,lordSIdx:findPlanetSignIdx(lord)};
  }

  // Every way the lords of two houses tie them together - one planet ruling
  // both, sign exchange, one lord sitting in or aspecting the other's house,
  // one lord aspecting the other, or the lords conjunct. Each link is
  // {type, text}; `type` keys LINK_STYLE, which colours the wheel.
  // `dir` is which way the wheel draws its arrowhead: 'ab' from the first
  // argument to the second, 'ba' the other way, and none at all for a
  // symmetric tie (conjunction, one lord for both houses).
  function linkHouses(A,B,sunSIdx){
    const links=[];
    if(A.lord===B.lord){
      links.push({type:'same',text:T('pg.link_same_lord',{planet:PN(A.lord),a:ORD(A.h),b:ORD(B.h)})});
      return links;
    }
    const lordOf=(X)=>({planet:PN(X.lord),a:ORD(X.h)});
    const exchange=A.lordSIdx===B.sIdx&&B.lordSIdx===A.sIdx;
    if(exchange) links.push({type:'exchange',dir:'both',text:T('pg.link_exchange',{p1:PN(A.lord),a:ORD(A.h),p2:PN(B.lord),b:ORD(B.h)})});
    [[A,B],[B,A]].forEach(([X,Y],i)=>{
      const dir=i===0?'ab':'ba';
      if(X.lordSIdx===-1) return;
      // An exchange already says each lord sits in the other's house.
      if(!exchange&&X.lordSIdx===Y.sIdx) links.push({type:'in',dir,text:T('pg.link_in',{...lordOf(X),b:ORD(Y.h)})});
      const asp=aspectsFrom(X.lord,X.lordSIdx,sunSIdx);
      const onHouse=asp.find(s=>s.sIdx===Y.sIdx);
      if(onHouse) links.push({type:'aspect',dir,text:T('pg.link_aspect_house',{...lordOf(X),b:ORD(Y.h),n:ORD(onHouse.off)})});
      // Y's lord sitting at home is already covered by the aspect on Y's house.
      const onLord=Y.lordSIdx!==-1&&Y.lordSIdx!==Y.sIdx&&asp.find(s=>s.sIdx===Y.lordSIdx);
      if(onLord) links.push({type:'aspect',dir,text:T('pg.link_aspect_lord',{...lordOf(X),other:PN(Y.lord),b:ORD(Y.h),n:ORD(onLord.off)})});
    });
    if(A.lordSIdx!==-1&&A.lordSIdx===B.lordSIdx)
      links.push({type:'conj',text:T('pg.link_conj',{p1:PN(A.lord),a:ORD(A.h),p2:PN(B.lord),b:ORD(B.h),sign:SN(SIGNS[A.lordSIdx])})});
    return links;
  }

  // Every way two placed grahas are tied - together in one sign, sign
  // exchange, one sitting in the other's sign, or aspect. P/Q are {code, sIdx}.
  function linkPlanets(P,Q,sunSIdx){
    const links=[];
    if(P.sIdx===Q.sIdx) links.push({type:'conj',text:T('pg.plink_conj',{p:PN(P.code),q:PN(Q.code),sign:SN(SIGNS[P.sIdx])})});
    const exchange=SIGN_LORD[SIGNS[P.sIdx]]===Q.code&&SIGN_LORD[SIGNS[Q.sIdx]]===P.code;
    if(exchange) links.push({type:'exchange',dir:'both',text:T('pg.plink_exchange',{p:PN(P.code),q:PN(Q.code)})});
    [[P,Q],[Q,P]].forEach(([X,Y],i)=>{
      const dir=i===0?'ab':'ba';
      if(!exchange&&SIGN_LORD[SIGNS[X.sIdx]]===Y.code)
        links.push({type:'in',dir,text:T('pg.plink_in',{p:PN(X.code),q:PN(Y.code),sign:SN(SIGNS[X.sIdx])})});
      const asp=aspectsFrom(X.code,X.sIdx,sunSIdx).find(s=>s.sIdx===Y.sIdx);
      if(asp) links.push({type:'aspect',dir,text:T('pg.plink_aspect',{p:PN(X.code),q:PN(Y.code),n:ORD(asp.off)})});
    });
    return links;
  }

  // 2-9-11: the three pairs of the wealth houses, through linkHouses.
  function compute2911(ascSIdx,sunSIdx){
    const info={};
    DHANA_HOUSES.forEach(h=>{info[h]=houseInfo(ascSIdx,h);});
    const pairs=[[2,9],[2,11],[9,11]].map(([a,b])=>({a,b,links:linkHouses(info[a],info[b],sunSIdx).map(l=>l.text)}));
    const offChart=[...new Set(DHANA_HOUSES.filter(h=>info[h].lordSIdx===-1).map(h=>info[h].lord))];
    return {info,pairs,offChart};
  }

  // Dharma Karmadhipati Yoga, judged by four rules only - not the wider
  // linkHouses checks. L9/L10 are houseInfo() results for the 9th and 10th.
  //   conj     - the two lords in one sign;
  //   mutual   - each lord aspects the other (one-way doesn't count);
  //   exchange - parivartana: each lord in the other's sign;
  //   in       - one lord in the other's house: a milder form.
  // Returns {sameLord} when one planet rules both, which none of the four
  // rules can describe; otherwise {rules:[{key, strong, ok, text}]}.
  function dharmaKarmaRules(L9,L10,sunSIdx){
    if(L9.lord===L10.lord) return {sameLord:L9.lord};
    const both=L9.lordSIdx!==-1&&L10.lordSIdx!==-1;
    const p9=PN(L9.lord),p10=PN(L10.lord),a=ORD(9),b=ORD(10);
    const conj=both&&L9.lordSIdx===L10.lordSIdx;
    const asp9=both&&aspectsFrom(L9.lord,L9.lordSIdx,sunSIdx).find(s=>s.sIdx===L10.lordSIdx);
    const asp10=both&&aspectsFrom(L10.lord,L10.lordSIdx,sunSIdx).find(s=>s.sIdx===L9.lordSIdx);
    const mutual=!!(asp9&&asp10);
    const exchange=both&&L9.lordSIdx===L10.sIdx&&L10.lordSIdx===L9.sIdx;
    const in9=L9.lordSIdx===L10.sIdx,in10=L10.lordSIdx===L9.sIdx;   // 9th lord in the 10th; 10th lord in the 9th
    const inText=[in9&&T('pg.link_in',{planet:p9,a,b}),in10&&T('pg.link_in',{planet:p10,a:b,b:a})].filter(Boolean).join('; ');
    return {rules:[
      {key:'conj',strong:true,ok:conj,
        text:conj?T('pg.link_conj',{p1:p9,a,p2:p10,b,sign:SN(SIGNS[L9.lordSIdx])}):''},
      // A one-way aspect is shown as a near miss so it is clear why it fails.
      {key:'mutual',strong:true,ok:mutual,
        text:mutual?T('pg.dk_mutual',{p1:p9,p2:p10,n1:ORD(asp9.off),n2:ORD(asp10.off)})
          :asp9?T('pg.dk_oneway',{p1:p9,p2:p10}):asp10?T('pg.dk_oneway',{p1:p10,p2:p9}):''},
      {key:'exchange',strong:true,ok:exchange,
        text:exchange?T('pg.link_exchange',{p1:p9,a,p2:p10,b}):''},
      {key:'in',strong:false,ok:in9||in10,text:inText},
    ]};
  }

  // Subathuvam on the 8th and 12th: Jupiter, Venus, or a qualifying Moon (see
  // SUBHA_MOON_DISTS) sitting in the house or aspecting it.
  function computeSubha(ascSIdx,sunSIdx){
    const moonSIdx=findPlanetSignIdx('Mon');
    const moon={placed:moonSIdx!==-1,counts:false,phase:''};
    if(moon.placed&&sunSIdx!==-1){
      const dist=((moonSIdx-sunSIdx+12)%12)+1;
      moon.counts=SUBHA_MOON_DISTS.includes(dist);
      moon.phase=moonPhaseLabel(moonBrightness(moonSIdx,sunSIdx),dist);
    }
    const givers=moon.counts?[...SUBHA_GIVERS,'Mon']:SUBHA_GIVERS;
    const houses=SUBHA_HOUSES.map(h=>{
      const sIdx=houseSign(ascSIdx,h),from=[];
      givers.forEach(p=>{
        const pS=findPlanetSignIdx(p);if(pS===-1) return;
        if(pS===sIdx) from.push(T('pg.subha_in',{planet:PN(p)}));
        const asp=aspectsFrom(p,pS,sunSIdx).find(s=>s.sIdx===sIdx);
        if(asp) from.push(T('pg.subha_aspect',{planet:PN(p),n:ORD(asp.off)}));
      });
      return {h,sIdx,from};
    });
    return {houses,moon,sunPlaced:sunSIdx!==-1};
  }

  // ── CONNECTION WHEEL ─────────────────────────────
  // Nodes around a circle, one line per connected pair: coloured by its
  // strongest link, thicker for more links. Three views:
  //   houses  - the 12 houses, linked through their lords;
  //   planets - the 9 grahas, linked to each other;
  //   mix     - houses on the outer ring, grahas on an inner ring, a line
  //             wherever a graha sits in, rules or aspects a house.
  // Tapping a node - or its chip, the keyboard/touch-friendly twin - keeps
  // only that node's lines lit and lists them in words beside the wheel.
  const WHEEL_MODES=['houses','planets','mix'];
  const WHEEL_TYPES={
    houses:['exchange','same','conj','in','aspect'],
    planets:['exchange','conj','in','aspect'],
    mix:['in','rules','aspect','via'],
  };
  let wheelMode='houses';
  let wheelSel=null;        // selected node id (house number or planet code, as a string)
  const wheelUid='wheel'+(++wheelUidSeq);

  // Nodes carry `ring`: 0 is the outer circle, 1 the inner one (mix view).
  function houseNodes(ascSIdx){
    const nodes=[];
    for(let h=1;h<=12;h++){
      const info=houseInfo(ascSIdx,h),sign=SIGNS[info.sIdx];
      nodes.push({id:String(h),kind:'house',ring:0,info,placed:true,label:String(h),chip:ORD(h),sub:shortLabel(SN(sign),3),
        name:`${ORD(h)} · ${SN(sign)}`,title:T('pg.wheel_house_title',{n:ORD(h),sign:SN(sign),planet:PN(info.lord)})});
    }
    return nodes;
  }
  function planetNodes(ring){
    return WHEEL_PLANETS.map(code=>{
      const sIdx=findPlanetSignIdx(code),placed=sIdx!==-1;
      return {id:code,kind:'planet',ring,info:{code,sIdx},placed,label:PA(code),chip:PA(code),
        sub:placed&&ring===0?shortLabel(SN(SIGNS[sIdx]),3):'',
        name:PN(code),title:placed?`${PN(code)} · ${SN(SIGNS[sIdx])}`:PN(code)};
    });
  }

  // How a placed graha touches house H: sitting in it, ruling it, or
  // aspecting it. Rahu/Ketu rule nothing and cast no aspect, so they take the
  // house they sit in plus the houses of the planets acting on them - their
  // dispositor (a node in Capricorn takes Saturn's Aquarius house too),
  // whoever sits with them, and whoever aspects them. Those arrows point
  // house -> node, since the pull runs from that house's lord.
  function linkPlanetHouse(P,H,sunSIdx){
    const links=[];
    const args={p:PN(P.code),h:ORD(H.h)};
    // Every tie here runs planet -> house, so they all point that way.
    if(P.sIdx===H.sIdx) links.push({type:'in',dir:'ab',text:T('pg.hlink_in',args)});
    if(P.code==='Rahu'||P.code==='Ketu'){
      if(H.sIdx===P.sIdx) return links;   // its own house is the placement above
      // The sign it sits in has a lord; that lord's other house counts too.
      const disp=SIGN_LORD[SIGNS[P.sIdx]];
      if(H.lord===disp) links.push({type:'via',dir:'ba',text:T('pg.hlink_dispositor',{...args,q:PN(disp)})});
      const lordSIdx=findPlanetSignIdx(H.lord);
      if(lordSIdx===-1) return links;
      if(lordSIdx===P.sIdx){
        links.push({type:'via',dir:'ba',text:T('pg.hlink_conj_node',{...args,q:PN(H.lord)})});
      } else {
        const onNode=aspectsFrom(H.lord,lordSIdx,sunSIdx).find(s=>s.sIdx===P.sIdx);
        if(onNode) links.push({type:'via',dir:'ba',text:T('pg.hlink_aspected',{...args,q:PN(H.lord),n:ORD(onNode.off)})});
      }
      return links;
    }
    if(H.lord===P.code) links.push({type:'rules',dir:'ab',text:T('pg.hlink_rules',args)});
    const asp=aspectsFrom(P.code,P.sIdx,sunSIdx).find(s=>s.sIdx===H.sIdx);
    if(asp) links.push({type:'aspect',dir:'ab',text:T('pg.hlink_aspect',{...args,n:ORD(asp.off)})});
    return links;
  }

  function wheelData(){
    const sunSIdx=findPlanetSignIdx('Sun');
    const ascSIdx=findPlanetSignIdx('Asc');
    if(wheelMode!=='planets'&&ascSIdx===-1) return null;
    const pairs=[];
    const addPair=(a,b,links)=>{
      if(!links.length) return;
      links.sort((x,y)=>LINK_ORDER.indexOf(x.type)-LINK_ORDER.indexOf(y.type));
      pairs.push({a,b,links,type:links[0].type});
    };
    let nodes;
    if(wheelMode==='mix'){
      const houses=houseNodes(ascSIdx),planets=planetNodes(1);
      nodes=[...houses,...planets];
      planets.forEach((P,pi)=>{
        if(!P.placed) return;
        houses.forEach((H,hi)=>addPair(houses.length+pi,hi,linkPlanetHouse(P.info,H.info,sunSIdx)));
      });
    } else {
      nodes=wheelMode==='houses'?houseNodes(ascSIdx):planetNodes(0);
      for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
        if(!nodes[i].placed||!nodes[j].placed) continue;
        addPair(i,j,wheelMode==='houses'?linkHouses(nodes[i].info,nodes[j].info,sunSIdx):linkPlanets(nodes[i].info,nodes[j].info,sunSIdx));
      }
    }
    return {nodes,pairs};
  }

  function nodeColors(node){
    if(node.kind==='house') return {fill:'#211b35',text:'#ffcc88',stroke:node.id==='1'?'#d4af37':'rgba(255,170,102,.55)'};
    if(node.id==='Mon'){
      const mc=moonColor(moonBrightness(node.info.sIdx,findPlanetSignIdx('Sun')));
      return {fill:mc.bg,text:mc.text,stroke:'rgba(220,230,255,.6)'};
    }
    return {fill:PLANET_BASE[node.id].bg,text:PLANET_BASE[node.id].text,stroke:'rgba(255,255,255,.35)'};
  }

  function buildWheelSection(){
    const modeBtns=WHEEL_MODES.map(m=>
      `<button type="button" class="wheel-mode${wheelMode===m?' on':''}" data-wheel-mode="${m}" aria-pressed="${wheelMode===m}">${T('pg.wheel_'+m)}</button>`).join('');
    const open=`<div class="dash-section" style="grid-column:1/-1"><h3 class="conn-h3">🕸 ${T('pg.wheel')}</h3>
      <div class="wheel-modes" role="group" aria-label="${T('pg.wheel')}">${modeBtns}</div>`;
    const d=wheelData();
    if(!d) return `${open}<div class="no-data">${T('pg.conn_need_asc')}</div></div>`;

    // Each ring spaces its own nodes evenly, starting at the top.
    const C=160,RING_R=[112,58],NODE_R=[16,13];
    const pos=[];
    [0,1].forEach(ring=>{
      const idxs=d.nodes.map((node,i)=>node.ring===ring?i:-1).filter(i=>i!==-1);
      idxs.forEach((i,k)=>{
        const a=-Math.PI/2+k*2*Math.PI/idxs.length;
        pos[i]={a,x:C+RING_R[ring]*Math.cos(a),y:C+RING_R[ring]*Math.sin(a)};
      });
    });
    const count=d.nodes.map((_,i)=>d.pairs.filter(p=>p.a===i||p.b===i).length);
    const selIdx=d.nodes.findIndex(x=>x.id===wheelSel);
    const partners=new Set(d.pairs.filter(p=>p.a===selIdx||p.b===selIdx).map(p=>p.a===selIdx?p.b:p.a));
    const f=(v)=>v.toFixed(1);

    // Lines within one ring bow toward the centre; ring-to-ring lines (the
    // mix view) run straight. The selected node's lines are drawn last so
    // they sit on top of the dimmed rest.
    const bow=wheelMode==='mix'?1:.35;
    // Where each line meets its two nodes: the control point sets the angle
    // it arrives from.
    const ends=d.pairs.map(p=>{
      const A=pos[p.a],B=pos[p.b];
      const qx=C+((A.x+B.x)/2-C)*bow,qy=C+((A.y+B.y)/2-C)*bow;
      return {qx,qy,a:Math.atan2(A.y-qy,A.x-qx),b:Math.atan2(B.y-qy,B.x-qx)};
    });
    const lines=d.pairs.map((p,pi)=>{
      const A=pos[p.a],B=pos[p.b];
      const {qx,qy}=ends[pi];
      const lit=selIdx===-1||p.a===selIdx||p.b===selIdx;
      const width=Math.min(1.6+(p.links.length-1)*1.2,5.5);
      // With nothing picked, aspect-only pairs - most of them - stay faint so
      // the stronger links read at a glance.
      const op=selIdx===-1?(p.type==='aspect'?.2:.85):lit?.95:.06;
      // Arrowheads: one per direction the links run. A mutual tie (mutual
      // aspect, exchange) gets both; a conjunction or shared lord gets none.
      // Only the picked node's lines carry heads. Drawn on every line the
      // overview turns into a pincushion, and direction is what you want
      // when reading one node anyway.
      const dirs=new Set(lit&&selIdx!==-1?p.links.flatMap(l=>l.dir==='both'?['ab','ba']:l.dir?[l.dir]:[]):[]);
      const toB=dirs.has('ab'),toA=dirs.has('ba');
      // Stop well short of the node's rim: the head needs to clear the
      // circle, and the extra distance fans arrowheads arriving at slightly
      // different angles apart instead of piling them on one spot.
      const trim=(P,rad,side)=>{
        const th=ends[pi][side],back=rad+(toA||toB?12:3);
        return {x:P.x-back*Math.cos(th),y:P.y-back*Math.sin(th)};
      };
      const A2=trim(A,NODE_R[d.nodes[p.a].ring],'a'),B2=trim(B,NODE_R[d.nodes[p.b].ring],'b');
      const marker=`${toB?` marker-end="url(#${wheelUid}-${p.type})"`:''}${toA?` marker-start="url(#${wheelUid}-${p.type})"`:''}`;
      return {lit:selIdx!==-1&&lit,svg:`<path d="M${f(A2.x)} ${f(A2.y)} Q${f(qx)} ${f(qy)} ${f(B2.x)} ${f(B2.y)}" fill="none" stroke="${LINK_STYLE[p.type].color}" stroke-width="${width}" stroke-linecap="round" opacity="${op}"${marker}/>`};
    }).sort((x,y)=>x.lit-y.lit).map(l=>l.svg).join('');

    // One arrowhead per link colour in play. Ids carry the chart's own
    // prefix, so the two charts in compare mode never share markers.
    const defs=`<defs>${[...new Set(d.pairs.map(p=>p.type))].map(t=>
      `<marker id="${wheelUid}-${t}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="${LINK_STYLE[t].color}"/></marker>`).join('')}</defs>`;

    const nodesSvg=d.nodes.map((node,i)=>{
      const {a,x,y}=pos[i];
      const isSel=i===selIdx;
      const dim=!node.placed||(selIdx!==-1&&!isSel&&!partners.has(i));
      const c=nodeColors(node);
      const r=NODE_R[node.ring];
      const lx=C+(RING_R[0]+30)*Math.cos(a),ly=C+(RING_R[0]+30)*Math.sin(a);
      return `<g class="wheel-node" data-wheel-node="${node.id}" opacity="${dim?.3:1}">
        <circle cx="${f(x)}" cy="${f(y)}" r="${r+7}" fill="transparent"/>
        ${isSel?`<circle cx="${f(x)}" cy="${f(y)}" r="${r+6}" fill="rgba(255,204,136,.22)"/>`:''}
        <circle class="wn" cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${c.fill}" stroke="${isSel?'#fff':partners.has(i)?'#ffcc88':c.stroke}" stroke-width="${isSel?3:partners.has(i)?2:1.4}"${node.placed?'':' stroke-dasharray="3 3"'}/>
        <text x="${f(x)}" y="${f(y)}" dy=".35em" text-anchor="middle" class="wheel-label${node.ring?' wheel-label-sm':''}" fill="${c.text}">${node.label}</text>
        ${node.sub?`<text x="${f(lx)}" y="${f(ly)}" dy=".35em" text-anchor="middle" class="wheel-sub">${node.sub}</text>`:''}
      </g>`;
    }).join('');

    // Centre: how many pairs connect overall, or how many partners the
    // selected node has.
    const centre=selIdx===-1
      ?[d.pairs.length,T('pg.wheel_pairs')]
      :[count[selIdx],T('pg.wheel_partners')];
    const svg=`<svg class="wheel-svg" viewBox="0 0 320 320" role="img" aria-label="${T('pg.wheel')}">
      ${defs}${lines}${nodesSvg}
      <text x="${C}" y="${C-4}" text-anchor="middle" class="wheel-centre-n">${centre[0]}</text>
      <text x="${C}" y="${C+14}" text-anchor="middle" class="wheel-centre-c">${centre[1]}</text></svg>`;

    const arrowNote=`<span class="wheel-arrows">${T('pg.wheel_arrows')}</span>`;
    const legend=`<div class="wheel-legend">${arrowNote}${WHEEL_TYPES[wheelMode].map(t=>`<span><i style="background:${LINK_STYLE[t].color}"></i>${T(LINK_STYLE[t].key)}</span>`).join('')}</div>`;

    let detail;
    if(selIdx===-1){
      const top=d.nodes.map((node,i)=>({node,n:count[i]})).filter(x=>x.n).sort((x,y)=>y.n-x.n).slice(0,3);
      detail=`<div class="wheel-hint">${T('pg.wheel_hint_'+wheelMode)}</div>
        ${top.length?`<div class="wheel-most">${T('pg.wheel_most')} ${top.map(x=>`<button type="button" class="wheel-jump" data-wheel-node="${x.node.id}">${x.node.name} (${x.n})</button>`).join(' ')}</div>`:''}`;
    } else {
      const node=d.nodes[selIdx];
      const mine=d.pairs.filter(p=>p.a===selIdx||p.b===selIdx).map(p=>({other:d.nodes[p.a===selIdx?p.b:p.a],links:p.links}));
      const body=!node.placed?`<div class="no-data">${T('pg.wheel_off_chart')}</div>`
        :mine.length?mine.map(m=>`<div class="wheel-partner">
            <button type="button" class="wheel-jump" data-wheel-node="${m.other.id}">${m.other.name}</button>
            <ul>${m.links.map(l=>`<li><span class="lt-dot" style="background:${LINK_STYLE[l.type].color}"></span>${l.text}</li>`).join('')}</ul>
          </div>`).join('')
        :`<div class="no-data">${T('pg.wheel_none')}</div>`;
      // Rahu/Ketu touch only their own house here; their real ties are to
      // planets, one tap away in the planets view.
      const nodeNote=wheelMode==='mix'&&(node.id==='Rahu'||node.id==='Ketu')
        ?`<div class="wheel-node-note">${T('pg.wheel_node_note',{p:PN(node.id)})}
            <button type="button" class="wheel-jump" data-wheel-mode="planets" data-wheel-node="${node.id}">${T('pg.wheel_show_planets')}</button></div>`
        :'';
      detail=`<div class="wheel-title">${node.title}</div>${body}${nodeNote}`;
    }

    const chip=(i)=>{
      const node=d.nodes[i];
      return `<button type="button" class="wheel-chip${i===selIdx?' on':''}" data-wheel-node="${node.id}" aria-pressed="${i===selIdx}"${node.placed?'':' disabled'}>${node.chip}<span class="wheel-count">${count[i]}</span></button>`;
    };
    // The mix view lists its grahas first, then breaks to a row of houses.
    const inner=d.nodes.map((node,i)=>node.ring===1?i:-1).filter(i=>i!==-1);
    const outer=d.nodes.map((node,i)=>node.ring===0?i:-1).filter(i=>i!==-1);
    const chips=inner.length
      ?inner.map(chip).join('')+'<span class="wheel-chip-break"></span>'+outer.map(chip).join('')
      :outer.map(chip).join('');

    return `${open}
      <div class="wheel-wrap">
        <div class="wheel-fig">${svg}${legend}</div>
        <div class="wheel-detail" aria-live="polite">${detail}</div>
      </div>
      <div class="wheel-chips">${chips}</div>
      <div class="conn-note">${T('pg.wheel_note_'+wheelMode)}</div></div>`;
  }

  // One listener on the tab (its HTML is rebuilt on every update) handles
  // the mode switch and every node, chip and partner button.
  function onConnectionsClick(e){
    const mode=e.target.closest('[data-wheel-mode]');
    if(mode){
      // A mode button can carry a node to select on arrival (the Rahu/Ketu
      // jump to the planets view); a plain one starts with nothing picked.
      const target=mode.dataset.wheelNode||null;
      if(mode.dataset.wheelMode!==wheelMode||target){wheelMode=mode.dataset.wheelMode;wheelSel=target;renderConnections();}
      return;
    }
    const node=e.target.closest('[data-wheel-node]');
    if(!node||node.disabled) return;
    wheelSel=wheelSel===node.dataset.wheelNode?null:node.dataset.wheelNode;
    renderConnections();
  }
  function renderConnections(){sec('conn').innerHTML=buildConnectionsTab();}

  function buildConnectionsTab(){
    const wheel=buildWheelSection();
    const ascSIdx=findPlanetSignIdx('Asc');
    // Only the planets view works without houses; the others already ask
    // for the Ascendant inside the wheel.
    if(ascSIdx===-1) return wheelMode==='planets'?wheel+`<div class="no-data" style="grid-column:1/-1">${T('pg.conn_need_asc')}</div>`:wheel;
    const sunSIdx=findPlanetSignIdx('Sun');
    const th=(key)=>`<th style="color:rgba(255,170,102,.7)">${T(key)}</th>`;
    const list=(items)=>items.length?`<ul class="conn-links">${items.map(x=>`<li>${x}</li>`).join('')}</ul>`:'—';
    const houseCell=(text)=>`<td style="white-space:nowrap;color:#ffcc88;font-family:'Cinzel',serif">${text}</td>`;

    // ── 2-9-11 ──
    const d=compute2911(ascSIdx,sunSIdx);
    const chips=DHANA_HOUSES.map(h=>{
      const x=d.info[h];
      return `<span class="conn-house"><b>${ORD(h)}</b> ${SN(SIGNS[x.sIdx])} · ${T('pg.conn_lord')} ${PN(x.lord)}</span>`;
    }).join('');
    const linked=d.pairs.filter(p=>p.links.length);
    // Two linked pairs already join all three houses; the third pair only
    // makes the connection complete.
    const verdict=linked.length===3?T('pg.conn_2911_full')
      :linked.length===2?T('pg.conn_2911_chain')
      :linked.length===1?T('pg.conn_2911_partial',{a:ORD(linked[0].a),b:ORD(linked[0].b)})
      :T('pg.conn_2911_none');
    const pairRows=d.pairs.map(p=>`<tr>${houseCell(`${p.a} ↔ ${p.b}`)}<td>${list(p.links)}</td>
      <td>${p.links.length?`<span class="conn-yes">✓ ${T('pg.conn_yes')}</span>`:`<span class="conn-no">✗ ${T('pg.conn_no')}</span>`}</td></tr>`).join('');
    const dhana=`<div class="dash-section" style="grid-column:1/-1"><h3 class="conn-h3">🔗 ${T('pg.conn_2911')}</h3>
      <div class="conn-houses">${chips}</div>
      <table class="signs-table"><tr>${th('pg.conn_pair')}${th('pg.conn_links')}${th('pg.conn_status')}</tr>${pairRows}</table>
      <div class="conn-verdict${linked.length>=2?' on':''}">${verdict}</div>
      ${d.offChart.length?`<div class="conn-note">${T('pg.conn_off_chart',{planets:d.offChart.map(PN).join(', ')})}</div>`:''}
      <div class="conn-note">${T('pg.conn_2911_note')}</div></div>`;

    // ── DHARMA KARMADHIPATI YOGA (9-10) ──
    // The 9th (dharma) and 10th (karma) lords, as a checklist of the four
    // rules in dharmaKarmaRules.
    const dk9=houseInfo(ascSIdx,9),dk10=houseInfo(ascSIdx,10);
    const dk=dharmaKarmaRules(dk9,dk10,sunSIdx);
    const dkChips=[dk9,dk10].map(x=>`<span class="conn-house"><b>${ORD(x.h)}</b> ${SN(SIGNS[x.sIdx])} · ${T('pg.conn_lord')} ${PN(x.lord)}</span>`).join('');
    const dkOff=[...new Set([dk9,dk10].filter(x=>x.lordSIdx===-1).map(x=>x.lord))];
    let dkBody,dkVerdict,dkOn;
    if(dk.sameLord){
      dkBody='';
      dkVerdict=T('pg.dk_same_lord',{planet:PN(dk.sameLord)});
      dkOn=false;
    } else {
      dkBody=dk.rules.map(r=>`<div class="dk-rule${r.ok?' ok':''}">
          <span class="dk-mark">${r.ok?'✓':'✗'}</span>
          <div><b>${T('pg.dk_r_'+r.key)}</b>${r.text?`<div class="dk-detail">${r.text}</div>`:''}</div>
        </div>`).join('');
      const strong=dk.rules.filter(r=>r.strong&&r.ok);
      const mild=dk.rules.find(r=>r.key==='in').ok;
      dkVerdict=strong.length?T('pg.dk_yes',{rules:strong.map(r=>T('pg.dk_r_'+r.key)).join(', ')})
        :mild?T('pg.dk_mild'):T('pg.dk_no');
      dkOn=strong.length>0||mild;
    }
    const dharma=`<div class="dash-section" style="grid-column:1/-1"><h3 class="conn-h3">☸ ${T('pg.dk_title')}</h3>
      <div class="conn-houses">${dkChips}</div>
      ${dkBody}
      <div class="conn-verdict${dkOn?' on':''}">${dkVerdict}</div>
      ${dkOff.length?`<div class="conn-note">${T('pg.conn_off_chart',{planets:dkOff.map(PN).join(', ')})}</div>`:''}
      <div class="conn-note">${T('pg.dk_note')}</div></div>`;

    // ── SUBATHUVAM IN 8th / 12th ──
    const s=computeSubha(ascSIdx,sunSIdx);
    const blessed=s.houses.filter(x=>x.from.length);
    const subhaVerdict=blessed.length===2?T('pg.subha_both')
      :blessed.length===1?T('pg.subha_only',{n:ORD(blessed[0].h)})
      :T('pg.subha_neither');
    const moonLine=!s.moon.placed?''
      :!s.sunPlaced?T('pg.subha_moon_need_sun')
      :s.moon.counts?T('pg.subha_moon_yes',{phase:s.moon.phase})
      :T('pg.subha_moon_no',{phase:s.moon.phase});
    const houseRows=s.houses.map(x=>`<tr>${houseCell(ORD(x.h))}<td>${SN(SIGNS[x.sIdx])}</td><td>${list(x.from)}</td>
      <td>${x.from.length?`<span class="conn-yes">✓ ${T('pg.subha_yes')}</span>`:`<span class="conn-no">✗ ${T('pg.subha_none')}</span>`}</td></tr>`).join('');
    const subha=`<div class="dash-section" style="grid-column:1/-1"><h3 class="conn-h3">✦ ${T('pg.conn_subha')}</h3>
      <table class="signs-table"><tr>${th('pg.conn_house')}${th('pg.sign')}${th('pg.subha_from')}${th('pg.conn_status')}</tr>${houseRows}</table>
      <div class="conn-verdict${blessed.length?' on':''}">${subhaVerdict}</div>
      ${moonLine?`<div class="conn-note">☽ ${moonLine}</div>`:''}
      <div class="conn-note">${T('pg.conn_subha_note')}</div></div>`;

    return wheel+dhana+dharma+subha;
  }


  // ═══════════════════════════════════════════════════
  //  SIGN COLORS DASHBOARD
  // ═══════════════════════════════════════════════════

  // Human-readable colour names live in the shared dictionary now, so they read
  // the same on this page as anywhere else - see TERMS["planet_colour"].
  const PLANET_COLOR_NAME=(planet)=>I18N.term('planet_colour',planet);

  // Named colors for blended results (rough perceptual mapping)
  function blendedColorName(layers){
    // layers = [{planet,type,rgb}]  type='placement'|'aspect'
    if(!layers.length) return {name:T('pg.default_parchment'),hex:'#c8bd9e'};

    // Find the dominant hue based on planets present
    const names=layers.map(l=>l.type==='aspect'?T('pg.aspect_overlay'):PLANET_COLOR_NAME(l.planet));
    // Compute blended RGB
    // We use the same radial-gradient stacking the chart does, but for the
    // card swatch we blend all equally
    let r=200,g=189,b=158; // parchment base in RGB
    layers.forEach(l=>{
      if(l.type==='aspect') return; // aspect color is overlay, keep base visual close
      const[pr,pg,pb]=l.rgb;
      // Average in each planet colour at 62% weight toward it
      r=Math.round(r*0.5+pr*0.5);
      g=Math.round(g*0.5+pg*0.5);
      b=Math.round(b*0.5+pb*0.5);
    });
    const hex='#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
    return{name:names.join(' + '),hex};
  }

  function rgbToHex(rgb){
    return '#'+rgb.map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');
  }

  // Get text color for a background (light vs dark)
  function contrastText(hex){
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    const lum=(0.299*r+0.587*g+0.114*b)/255;
    return lum>0.45?'#1a1000':'#f0e8d0';
  }

  function updateSignColorsDashboard(){
    const el=sec('sigcol');
    if(!el) return;

    const anyPlaced=Object.values(cellPlanets).some(a=>a&&a.length>0);
    if(!anyPlaced){el.innerHTML=`<div class="no-data">${T('pg.no_data_colors')}</div>`;return;}

    const sunSIdx=findPlanetSignIdx('Sun');

    // For every sign, collect which planets color it and how (placement vs aspect)
    // signInfo[signIdx] = [{planet, type:'placement'|'aspect', rgb, colorName, hex}]
    const signInfo={};
    for(let i=0;i<12;i++) signInfo[i]=[];

    for(let pos=0;pos<16;pos++){
      if(!cellPlanets[pos]?.length||!GRID_SIGNS[pos]) continue;
      const si=SIGNS.indexOf(GRID_SIGNS[pos]);
      cellPlanets[pos].forEach(planet=>{
        if(planet==='Asc') return;
        // Only include if showColor is on for this planet
        if(!showColor[planet]) return;

        const offsets=getAspectOffsets(planet,si,sunSIdx);
        offsets.forEach(off=>{
          const target=aspectSign(si,off);
          let rgb;
          if(planet==='Mon'){
            const bright=moonBrightness(si,sunSIdx);
            if(bright<=0) return;
            rgb=moonColor(bright).mix;
          } else {
            rgb=PLANET_BASE[planet].mix;
            if(!rgb) return;
          }

          const type=(off===1)?'placement':'aspect';
          const hex=rgbToHex(rgb);

          // Avoid duplicate entries for same planet+sign combo
          const already=signInfo[target].find(e=>e.planet===planet&&e.type===type);
          if(!already){
            let colorNameStr;
            if(planet==='Mon'){
              const bright=moonBrightness(si,sunSIdx);
              const moonPct=Math.round(bright*100);
              colorNameStr=moonPct>=99?T('pg.full_moon_silver'):moonPct<=1?T('pg.new_moon_dark'):
                           T('pg.moon_brightness',{pct:moonPct});
            } else {
              colorNameStr=type==='aspect'?T('pg.aspect_overlay'):PLANET_COLOR_NAME(planet);
            }
            signInfo[target].push({planet,type,rgb,hex,colorNameStr});
          }
        });
      });
    }

    // Build the grid of sign color cards
    // Group into rows of 4 (matching the chart layout order)
    const gridOrder=['Pisces','Aries','Taurus','Gemini','Aquarius','Cancer','Capricorn','Leo','Sagittarius','Scorpio','Libra','Virgo'];

    let html=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;padding:4px 0;">`;

    gridOrder.forEach(signName=>{
      const sIdx=SIGNS.indexOf(signName);
      const layers=signInfo[sIdx];
      const el2=SIGN_ELEMENT[signName];

      // Compute blended background for the swatch
      let swatchBg='#c8bd9e'; // default parchment
      let swatchText='#1a1000';
      if(layers.length){
        // Do a proper blend: start with parchment, overlay each planet color
        let r=200,g=189,b=158;
        layers.forEach((l,i)=>{
          const alpha=0.55;
          r=Math.round(r*(1-alpha)+l.rgb[0]*alpha);
          g=Math.round(g*(1-alpha)+l.rgb[1]*alpha);
          b=Math.round(b*(1-alpha)+l.rgb[2]*alpha);
        });
        swatchBg='#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
        swatchText=contrastText(swatchBg);
      }

      // Planet chips
      const chipsHtml=layers.map(l=>{
        const chipBg=l.type==='aspect'?'rgba(255,255,255,.08)':l.hex+'33';
        const chipBorder=l.type==='aspect'?'rgba(255,255,255,.15)':l.hex+'88';
        const chipText=l.type==='aspect'?'rgba(200,195,175,.65)':l.hex;
        return `<span class="sign-color-chip" style="background:${chipBg};border:1px solid ${chipBorder};color:${chipText};">
          ${l.type!=='aspect'?`<span class="chip-dot" style="background:${l.hex};"></span>`:''}
          <span title="${PN(l.planet)}">${PA(l.planet)}</span>
          <span style="font-weight:400;opacity:.7;font-size:7.5px">${l.type==='aspect'?T('pg.aspect_tag'):T('pg.placed_tag')}</span>
        </span>`;
      });

      // Color name strings
      const placedLayers=layers.filter(l=>l.type==='placement');
      const aspectLayers=layers.filter(l=>l.type==='aspect');
      const colorDesc=layers.length===0?T('pg.default_parchment'):
        [
          ...placedLayers.map(l=>l.colorNameStr),
          ...aspectLayers.length?['+ '+T('pg.aspect_overlay')]:[]
        ].join(', ');

      html+=`<div class="sign-color-card">
        <div class="sign-color-row">
          <!-- Swatch -->
          <div class="sign-swatch" style="background:${swatchBg};display:flex;align-items:center;justify-content:center;">
            <span style="font-family:'Cinzel',serif;font-size:9px;font-weight:700;color:${swatchText};text-align:center;line-height:1.2;padding:2px;">${shortLabel(SN(signName),3)}</span>
          </div>
          <!-- Info -->
          <div class="sign-color-info">
            <div class="sign-name">
              <span class="el-${el2}">${SN(signName)}</span>
              <span style="font-size:8px;margin-left:4px;color:rgba(200,195,175,.4)">${swatchBg}</span>
            </div>
            ${layers.length===0
              ? `<div style="font-size:9px;color:rgba(200,195,175,.35);font-style:italic">${T('pg.no_influence')}</div>`
              : `<div class="sign-color-layers">${chipsHtml.join('')}</div>`
            }
            <div style="font-size:8px;color:rgba(200,195,175,.4);margin-top:3px;">${colorDesc}</div>
          </div>
        </div>
      </div>`;
    });

    html+='</div>';
    el.innerHTML=html;
  }

  // ── LANGUAGE ──────────────────────────────────────
  // Two kinds of text need attention on a switch: the few strings that
  // interpolate a translated value (so a plain data-i18n attribute can't carry
  // them), and everything the dashboards build at render time. I18N.apply()
  // covers the rest - the static chrome and the sign labels on the grid.
  function refreshStaticText(){
    const legend=root.querySelector('.legend');
    if(legend) legend.innerHTML=T('pg.legend',{asc:PA('Asc')});
    PLANETS.forEach(p=>{
      const arr=cbArrows[p];
      if(arr) arr.title=T('pg.show_arrows_for',{planet:PN(p)});
      const col=cbColors[p];
      if(col) col.title=T('pg.show_colors_for',{planet:PN(p)});
      // "<planet> (on chart)" placeholders are written once, when the planet
      // leaves the palette, so they need retranslating in place.
      const ph=paletteSlots[p]?.querySelector('.palette-placeholder');
      if(ph) ph.textContent=T('pg.on_chart',{planet:PN(p)});
      // Same for the palette tokens themselves. updateAll() rebuilds the ones
      // sitting on the chart (renderCell re-runs createToken), but a token still
      // in its palette slot is only ever built once - at init, or when the
      // planet comes back off the chart - so without this it keeps whichever
      // language it was born in.
      const tok=paletteSlots[p]?.querySelector('.planet-token');
      if(tok){ tok.textContent=PA(p); tok.title=PN(p); }
    });
  }

  // ── CONTROL WIRING ─────────────────────────────────
  // These used to be inline onclick/oninput attributes calling page-global
  // functions; with two charts on screen each panel has to reach its own.
  root.querySelector('.js-clear').addEventListener('click',clearAll);
  sec('conn').addEventListener('click',onConnectionsClick);
  root.querySelector('.ray-opacity').addEventListener('input',function(){onRayOpacityChange(this);});
  root.querySelector('.moon-light-toggle').addEventListener('change',function(){showMoonLight=this.checked;updateMoonKendraLight();});
  root.querySelector('.cb-master-arrow').addEventListener('change',function(){toggleAllCb('arrow',this.checked);});
  root.querySelector('.cb-master-color').addEventListener('change',function(){toggleAllCb('color',this.checked);});
  root.querySelector('.dash-tabs').addEventListener('click',function(e){
    const tab=e.target.closest('.dash-tab');
    if(tab) switchTab(tab.dataset.tab);
  });

  // ── INIT ────────────────────────────────────────────
  I18N.apply(root);   // the clone carries data-i18n markers but was never translated
  refreshStaticText();
  updateAll();
  I18N.onChange(()=>{
    refreshStaticText();
    updateAll();   // redraws tokens, house numbers, rays and all 8 dashboards
  });
  window.addEventListener('resize',updateRays);

  // ── PUBLIC API ─────────────────────────────────────
  // Placements travel between charts as a plain {planet: sign} map - the same
  // shape the ?positions= URL param uses - so copy/swap and URL loading share
  // one code path.
  return {
    root,
    updateAll,
    clearAll,
    setTab:(tab)=>switchTab(tab,false),
    getScores:()=>lastScores,
    getTab:()=>activeTab,
    getPlacements(){
      const out={};
      for(let pos=0;pos<16;pos++){
        if(!GRID_SIGNS[pos]) continue;
        (cellPlanets[pos]||[]).forEach(p=>{out[p]=GRID_SIGNS[pos];});
      }
      return out;
    },
    setPlacements(map){
      clearAll();
      Object.entries(map||{}).forEach(([planet,sign])=>{
        const pos=GRID_SIGNS.findIndex(s=>s===sign);
        if(pos===-1||!PLANETS.includes(planet)) return;
        addPlanetToCell(pos,planet);
      });
    },
  };
}

// ═══════════════════════════════════════════════════
//  DRIK BALA (aspectual strength)          [NEW HERE]
// ═══════════════════════════════════════════════════
// The one piece of maths this panel adds that the playground does not have.
//
// Whole-sign, like everything else in this app: a graha's Drik Bala is the
// net of the benefic and malefic drishti falling on it. It deliberately
// reuses getAspectOffsets(), so the number always agrees with the aspect
// rays already drawn on the chart above it - including the Moon's
// phase-dependent aspects, which is why sunSIdx has to be passed down.
//
// Offset 1 (the graha's own sign) is part of getAspectOffsets, so a
// conjunction counts as drishti here exactly as it does in the Subathuva
// engine. Rahu and Ketu cast no aspect of their own but still receive one.
const DRIK_GOOD_WEIGHT={Jup:1.0,Ven:0.8,Mer:0.7};
const DRIK_BAD_WEIGHT={Sat:0.70,Mar:0.60,Rahu:0.80,Ketu:0.30,Sun:0.20};
const DRIK_MALEFICS=['Sat','Mar','Rahu','Ketu','Sun'];
// A full ±300 of raw drishti is treated as the practical extreme, so the
// published 0-100 score keeps 50 as "nothing is looking at this graha".
const DRIK_RAW_SPAN=300;

function computeDrikBala(placements){
  const sIdxOf={};
  Object.entries(placements||{}).forEach(([p,sign])=>{
    const i=SIGNS.indexOf(sign);
    if(i!==-1) sIdxOf[p]=i;
  });
  const sunSIdx=sIdxOf.Sun!==undefined?sIdxOf.Sun:-1;
  const moonSIdx=sIdxOf.Mon!==undefined?sIdxOf.Mon:-1;
  const bright=moonSIdx!==-1?moonBrightness(moonSIdx,sunSIdx):0;
  const badFactor=moonSIdx!==-1?moonBadFactor(moonSIdx,sunSIdx):0;

  // Mercury is the one conditional graha: benefic on its own, malefic when
  // it shares a sign with one. Resolved once, up front, so every target
  // sees the same Mercury.
  let merMalefic=false;
  if(sIdxOf.Mer!==undefined){
    merMalefic=DRIK_MALEFICS.some(m=>sIdxOf[m]!==undefined&&sIdxOf[m]===sIdxOf.Mer)
      ||(moonSIdx!==-1&&moonSIdx===sIdxOf.Mer&&badFactor>0);
  }

  const out={};
  Object.keys(sIdxOf).forEach(target=>{
    if(target==='Asc') return;
    const tIdx=sIdxOf[target];
    let raw=0;const good=[],bad=[];
    Object.keys(sIdxOf).forEach(src=>{
      if(src==='Asc'||src===target) return;
      const srcIdx=sIdxOf[src];
      const reaches=getAspectOffsets(src,srcIdx,sunSIdx)
        .some(off=>aspectSign(srcIdx,off)===tIdx);
      if(!reaches) return;

      if(src==='Mon'){
        if(bright>0){const pts=100*bright;raw+=pts;good.push({src,pts});}
        if(badFactor>0){const pts=100*badFactor;raw-=pts;bad.push({src,pts});}
        return;
      }
      if(src==='Mer'){
        const pts=100*(merMalefic?DRIK_BAD_WEIGHT.Sat:DRIK_GOOD_WEIGHT.Mer);
        if(merMalefic){raw-=pts;bad.push({src,pts});}
        else{raw+=pts;good.push({src,pts});}
        return;
      }
      if(DRIK_GOOD_WEIGHT[src]!==undefined){
        const pts=100*DRIK_GOOD_WEIGHT[src];raw+=pts;good.push({src,pts});return;
      }
      if(DRIK_BAD_WEIGHT[src]!==undefined){
        const pts=100*DRIK_BAD_WEIGHT[src];raw-=pts;bad.push({src,pts});
      }
    });
    const score=Math.max(0,Math.min(100,Math.round(50+raw/DRIK_RAW_SPAN*50)));
    out[target]={score,raw:Math.round(raw),good,bad};
  });
  return out;
}

// ── shared bits the orchestration needs ───────────
// pBadge/buildBar/BC live inside the chart factory, so the panel-level code
// below (which has no chart instance) gets its own module-level twins.
const PLANET_OF_LORD={Sun:'Sun',Moon:'Mon',Mars:'Mar',Mercury:'Mer',Jupiter:'Jup',
                      Venus:'Ven',Saturn:'Sat',Rahu:'Rahu',Ketu:'Ketu'};
const ST_BC={
  good:'linear-gradient(90deg,#116633,#44ff88)',
  bad:'linear-gradient(90deg,#881100,#ff4433)',
};
function stBadge(planet){
  const c=PLANET_BASE[planet];
  if(!c) return I18N.term('pg_planet_abbr',planet);
  const bg=c.bg==='transparent'?'rgba(212,175,55,.15)':c.bg;
  return `<span title="${PN(planet)}" style="display:inline-block;padding:1px 6px;border-radius:3px;font-size:9px;font-weight:700;font-family:'Cinzel',serif;background:${bg};color:${c.text}">${PA(planet)}</span>`;
}
function stBar(pct,bg,height){
  return `<div style="flex:1;height:${height||'8px'};background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;min-width:60px;">
    <div style="height:100%;width:${Math.min(Math.max(pct,0),100)}%;background:${bg};border-radius:4px;transition:width .4s;"></div></div>`;
}

// ══════════════════════════════════════════════════
//  STRENGTH PANEL ORCHESTRATION
// ══════════════════════════════════════════════════
// Two charts: the natal one, fixed, and the gochar one, which follows a date
// the user scrubs inside whichever dasha period they tapped in the table on
// the Chart tab. Both are scored by the same engine, so their numbers are
// directly comparable - that is the whole point of the tab.
//
// Both are also fully interactive. Dragging a planet makes a chart stop
// describing the real horoscope, so a "modified" banner appears with a reset.
(function () {
  const panel = document.getElementById('strengthPanel');
  if (!panel) return;
  const natalEl = document.getElementById('strengthNatalData');
  const birthEl = document.getElementById('gocharBirthData');
  if (!natalEl || !birthEl) return;

  const NATAL = JSON.parse(natalEl.textContent || '{}');
  const BIRTH = JSON.parse(birthEl.textContent || '{}');
  const FAST_MOVERS = ['Mon', 'Sun', 'Mer', 'Ven'];

  const panelsEl = panel.querySelector('.panels');
  const tpl = document.getElementById('strengthPanelTpl');
  const periodEl = panel.querySelector('.st-period');
  const statusEl = panel.querySelector('.st-status');
  const compareEl = panel.querySelector('.st-compare');
  const sparkEl = panel.querySelector('.st-spark');
  const dateInput = panel.querySelector('.st-date');
  const slider = panel.querySelector('.st-slider');
  const frameWrap = panel.querySelector('.st-frame');

  let period = null;          // {chain, start, end}
  let sparkView = 'each';     // 'each' | 'combined'
  let sparkPicked = null;     // Set of graha codes drawn on the curve
  let picksTouched = false;   // once true, the ticks stop following the chain
  let tappedChain = null;     // the row that set the slider's span
  let frame = 'lagna';        // 'lagna' | 'moon'
  let timeline = null;        // {samples:[{date,positions}], sample_days}
  let transitPositions = null;
  let transitDate = null;
  let busy = false;
  let reqSeq = 0;             // drops out-of-order slider responses
  let chartNatal = null, chartGochar = null;
  let scoresNatal = null, scoresGochar = null;

  // ── date helpers (UTC, matching the dasha table's own arithmetic) ──
  const dayMs = 86400000;
  const toDate = (iso) => new Date(iso + 'T00:00:00Z');
  const isoOf = (d) => d.toISOString().slice(0, 10);
  const daysBetween = (a, b) => Math.round((toDate(b) - toDate(a)) / dayMs);
  const shiftDays = (iso, n) => isoOf(new Date(toDate(iso).getTime() + n * dayMs));
  const clampDate = (iso, lo, hi) => (iso < lo ? lo : iso > hi ? hi : iso);

  // The sign that counts as house 1. Overriding "Asc" in a placements map is
  // exactly equivalent to counting houses from that sign, which is how a
  // transit gets judged from the natal Lagna (or the natal Moon) without the
  // scoring engine needing to know anything about frames.
  function frameSign() {
    return frame === 'moon' ? NATAL.Mon : NATAL.Asc;
  }
  function framed(positions) {
    const out = Object.assign({}, positions);
    const f = frameSign();
    if (f) out.Asc = f;
    return out;
  }

  // ── strength of one graha, from the pure engine functions only ──
  // Deliberately excludes Subathuva, which needs a live chart instance; this
  // is what lets the sparkline be computed for hundreds of sampled dates.
  function pureStrength(positions, planet) {
    const sign = positions[planet];
    if (!sign) return null;
    const ascSign = frameSign();
    const ascSIdx = SIGNS.indexOf(ascSign);
    const stana = getStanaBala(planet, sign).score;
    const dig = getDigBala(planet, sign, ascSIdx);
    const nish = getNishBala(planet, sign, ascSIdx);
    const dk = computeDrikBala(framed(positions))[planet];
    const drik = dk ? dk.score : 50;
    return {
      stana, dig, nish, drik, sign,
      total: Math.round(stana * 0.40 + ((dig + nish) / 2) * 0.25 + drik * 0.35),
    };
  }

  // ── build the two charts ──
  function buildChart(labelKey, badgeClass) {
    const root = tpl.content.firstElementChild.cloneNode(true);
    root.classList.add(badgeClass);
    panelsEl.appendChild(root);
    const badge = root.querySelector('.panel-badge');
    if (badge) badge.setAttribute('data-i18n', labelKey);
    return createStrengthChart(root, {
      onTabChange(tab) {
        // The two charts answer the same question, so they stay on the same
        // tab - comparing Stana Bala against Dig Bala would be meaningless.
        if (chartNatal && chartNatal.getTab() !== tab) chartNatal.setTab(tab);
        if (chartGochar && chartGochar.getTab() !== tab) chartGochar.setTab(tab);
        renderCompare();
      },
      onScores() { scheduleCompare(); },
    });
  }

  let compareTimer = null;
  function scheduleCompare() {
    // Both charts fire onScores during a redraw; coalesce into one render.
    clearTimeout(compareTimer);
    compareTimer = setTimeout(renderCompare, 0);
  }

  // ── the natal-vs-gochar table ──
  function renderCompare() {
    if (!compareEl) return;
    scoresNatal = chartNatal ? chartNatal.getScores() : null;
    scoresGochar = chartGochar ? chartGochar.getScores() : null;
    if (!scoresNatal || !scoresGochar) {
      compareEl.innerHTML = '';
      return;
    }
    const lords = period ? period.chain.map((c) => PLANET_OF_LORD[c.label]).filter(Boolean) : [];
    const byPlanet = (arr) => {
      const m = {};
      (arr || []).forEach((r) => { m[r.planet] = r; });
      return m;
    };
    const nT = byPlanet(scoresNatal.total), gT = byPlanet(scoresGochar.total);
    const all = [...new Set([...Object.keys(nT), ...Object.keys(gT)])];
    // Dasha lords first, in chain order, then everything else by natal rank.
    all.sort((a, b) => {
      const ia = lords.indexOf(a), ib = lords.indexOf(b);
      if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
      return (nT[b] ? nT[b].total : 0) - (nT[a] ? nT[a].total : 0);
    });
    const rows = all.map((p) => {
      const n = nT[p] ? nT[p].total : null;
      const g = gT[p] ? gT[p].total : null;
      const d = (n !== null && g !== null) ? g - n : null;
      const lordIdx = lords.indexOf(p);
      const roleKey = lordIdx !== -1 && period ? period.chain[lordIdx].role : null;
      const dColor = d === null ? 'rgba(200,195,175,.4)' : d > 0 ? '#44ff88' : d < 0 ? '#ff6655' : 'rgba(200,195,175,.5)';
      const maxAbs = Math.max(...all.map((q) => Math.abs((gT[q] ? gT[q].total : 0) - (nT[q] ? nT[q].total : 0))), 1);
      return `<tr${lordIdx !== -1 ? ' class="st-lord-row"' : ''}>
        <td>${stBadge(p)}${roleKey ? `<span class="st-role">${I18N.term('dasha_level', roleKey)}</span>` : ''}</td>
        <td>${n === null ? '&mdash;' : n}</td>
        <td>${g === null ? '&mdash;' : g}</td>
        <td><div style="display:flex;align-items:center;gap:4px">${stBar(d === null ? 0 : Math.abs(d) / maxAbs * 100, d >= 0 ? ST_BC.good : ST_BC.bad, '5px')}<span style="color:${dColor};font-size:9px;min-width:30px">${d === null ? '&mdash;' : (d > 0 ? '+' : '') + d}</span></div></td>
      </tr>`;
    }).join('');
    compareEl.innerHTML =
      `<div class="dash-section st-compare-section"><h3 class="st-compare-h3">&#8646; ${T('st.compare_title')}</h3>
        <table class="signs-table"><tr>
          <th style="color:rgba(255,204,68,.7)">${T('pg.planet')}</th>
          <th style="color:rgba(85,204,255,.7)">${T('st.col_natal')}</th>
          <th style="color:rgba(255,153,170,.7)">${T('st.col_gochar')}</th>
          <th style="color:rgba(204,136,255,.7)">${T('st.col_delta')}</th></tr>
          ${rows}
        </table>
        <div class="st-note">${T('st.compare_note')}</div>
      </div>`;
  }

  // ── the bala-over-time curve ──
  // Two readings of the same period. "Each graha" draws one line per graha
  // the reader has ticked. "Combined" folds them into a single line, each
  // graha carrying the weight of the seat it holds in the running chain -
  // the Mahadasa lord counts for most, its Bhukti lord half that, and so on
  // down. Grahas that hold no seat in this chain can still be ticked, and
  // ride along at the smallest weight.
  const SPARK_MIN_SPAN = 20;
  const ALL_GRAHAS = ['Sun', 'Mon', 'Mar', 'Mer', 'Jup', 'Ven', 'Sat', 'Rahu', 'Ketu'];
  // Mahadasa, Bhukti, Antara, Sookshma. Halving at each step keeps the
  // ordering the reader asked for without any one seat swamping the rest.
  const CHAIN_WEIGHTS = [8, 4, 2, 1];
  const OTHER_WEIGHT = 0.5;

  // The seat weights for this period, summed when one graha holds two of
  // them - a lord that is also its own Bhukti lord genuinely rules twice.
  function seatWeights() { return seatWeightsOf(period ? period.chain : []); }
  function seatWeightsOf(chain) {
    const w = {};
    (chain || []).forEach((c, i) => {
      const g = PLANET_OF_LORD[c.label];
      if (!g) return;
      w[g] = (w[g] || 0) + (i < CHAIN_WEIGHTS.length ? CHAIN_WEIGHTS[i] : OTHER_WEIGHT);
    });
    return w;
  }
  function weightOf(g, seats) {
    return seats[g] !== undefined ? seats[g] : OTHER_WEIGHT;
  }
  function defaultPicked() {
    const seats = seatWeights();
    const picked = Object.keys(seats);
    return new Set(picked.length ? picked : ['Sun']);
  }

  // Token colours are chosen to sit on a pale chart; the darkest of them
  // vanish against this panel, so those fall back to their text colour.
  function lineColor(g) {
    const base = PLANET_BASE[g];
    if (!base || !base.mix) return '#55ccff';
    const [r, gg, b] = base.mix;
    const lum = 0.299 * r + 0.587 * gg + 0.114 * b;
    return lum < 90 ? (base.text || '#cccccc') : base.bg;
  }

  function sparkDomain(vals) {
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (hi - lo < SPARK_MIN_SPAN) {
      const mid = (hi + lo) / 2;
      lo = mid - SPARK_MIN_SPAN / 2;
      hi = mid + SPARK_MIN_SPAN / 2;
    }
    const pad = (hi - lo) * 0.08;
    lo = Math.max(0, Math.floor(lo - pad));
    hi = Math.min(100, Math.ceil(hi + pad));
    if (hi - lo < 5) hi = Math.min(100, lo + 5);
    if (hi <= lo) { lo = 0; hi = 100; }
    return { lo, hi };
  }

  // Centred running mean. The combined line is a blend of nine grahas, the
  // swiftest of which jump a rasi between samples, so without this the
  // shape of the dasa is lost in the chatter.
  function smoothSeries(vals) {
    const win = Math.max(1, Math.round(vals.length * 0.06) | 1);
    if (win <= 1) return vals.slice();
    const half = (win - 1) / 2;
    return vals.map((_, i) => {
      let sum = 0, n = 0;
      for (let k = i - half; k <= i + half; k++) {
        if (k >= 0 && k < vals.length) { sum += vals[k]; n++; }
      }
      return sum / n;
    });
  }

  function renderSparkline() {
    if (!sparkEl) return;
    if (!timeline || !period || !timeline.samples.length) { sparkEl.innerHTML = ''; return; }
    if (!sparkPicked) sparkPicked = defaultPicked();

    const seats = seatWeights();
    const picked = ALL_GRAHAS.filter((g) => sparkPicked.has(g));
    const dates = timeline.samples.map((s) => s.date);

    // One value series per graha, over the sampled dates.
    const series = {};
    ALL_GRAHAS.forEach((g) => {
      series[g] = timeline.samples.map((s) => {
        const v = pureStrength(s.positions, g);
        return v ? v.total : null;
      });
    });

    const picker = grahaPickerHTML(seats);
    if (!picked.length) {
      sparkEl.innerHTML =
        `<div class="st-spark-head">${T('st.spark_title')}</div>
         ${sparkTabsHTML()}
         <div class="st-note st-spark-empty">${T('st.spark_none')}</div>
         ${picker}`;
      return;
    }

    // What gets drawn: one line per graha, or a single weighted blend.
    let lines;
    if (sparkView === 'combined') {
      // Seats are re-read for every sampled day, so a graha's weight rises
      // and falls as it takes and leaves its Bhukti or Antara. That keeps
      // the line fixed while the slider moves over it, instead of the whole
      // curve shifting each time the reader scrubs.
      const chains = (typeof window.strengthChainsAt === 'function')
        ? window.strengthChainsAt(dates, period.depth) : null;
      const seatsAt = chains
        ? chains.map((c) => seatWeightsOf(c && c.length ? c : period.chain))
        : dates.map(() => seats);
      const blended = dates.map((_, i) => {
        let sum = 0, w = 0;
        picked.forEach((g) => {
          const v = series[g][i];
          if (v === null) return;
          const gw = weightOf(g, seatsAt[i]);
          sum += v * gw; w += gw;
        });
        return w ? sum / w : null;
      });
      const usable = blended.map((v) => (v === null ? 0 : v));
      lines = [{ key: 'combined', color: '#ffcc44', vals: smoothSeries(usable), width: 2.2 }];
    } else {
      lines = picked.map((g) => ({
        key: g, color: lineColor(g),
        vals: series[g].map((v) => (v === null ? 0 : v)), width: 1.5,
      }));
    }

    const allVals = lines.reduce((a, l) => a.concat(l.vals), []);
    if (allVals.length < 2) { sparkEl.innerHTML = picker; return; }
    const { lo, hi } = sparkDomain(allVals);
    const W = 640, H = 140;
    const x = (i) => i / (dates.length - 1) * W;
    const y = (v) => (1 - (v - lo) / (hi - lo)) * H;

    const ticks = [0, 1, 2, 3, 4].map((k) => Math.round(hi - (hi - lo) * k / 4));
    const grid = ticks.map((t) =>
      `<line x1="0" y1="${y(t).toFixed(1)}" x2="${W}" y2="${y(t).toFixed(1)}" class="st-spark-grid"/>`
    ).join('');

    const paths = lines.map((l) => {
      const d = l.vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
      const area = l.key === 'combined'
        ? `<path d="M0,${H} L${d.slice(1)} L${W},${H} Z" class="st-spark-area"/>` : '';
      return `${area}<path d="${d}" class="st-spark-line" style="stroke:${l.color};stroke-width:${l.width}"/>`;
    }).join('');

    // The gochar date on the slider. Its readings come from the exact
    // transit rather than the sampled line, so they match the dashboards.
    let marker = '', badge = '';
    const exactOf = {};
    if (transitDate) {
      const total = daysBetween(period.start, period.end) || 1;
      const frac = Math.max(0, Math.min(1, daysBetween(period.start, transitDate) / total));
      marker = `<line x1="${(frac * W).toFixed(1)}" y1="0" x2="${(frac * W).toFixed(1)}" y2="${H}" class="st-spark-marker"/>`;
      if (transitPositions) {
        picked.forEach((g) => {
          const v = pureStrength(transitPositions, g);
          if (v) exactOf[g] = v.total;
        });
        if (sparkView === 'combined') {
          let sum = 0, w = 0;
          picked.forEach((g) => {
            if (exactOf[g] === undefined) return;
            const gw = weightOf(g, seats);
            sum += exactOf[g] * gw; w += gw;
          });
          if (w) badge = `<span class="st-spark-badge" style="left:${(frac * 100).toFixed(2)}%">${Math.round(sum / w)}</span>`;
        }
      }
    }

    const xLabels = [0, 1, 2, 3].map((k) =>
      `<span>${dates[Math.round(k / 3 * (dates.length - 1))]}</span>`).join('');

    // Legend doubles as the reading at the selected gochar date.
    const legend = sparkView === 'combined'
      ? `<span class="st-spark-key"><i style="border-top-color:#ffcc44"></i>${T('st.spark_combined_key')}</span>
         <span class="st-spark-key"><i class="k-marker"></i>${T('st.spark_key_marker')}</span>`
      : picked.map((g) =>
          `<span class="st-spark-key"><i style="border-top-color:${lineColor(g)}"></i>${PN(g)}
             <b>${exactOf[g] !== undefined ? exactOf[g] : '&mdash;'}</b>
             <em>&times;${weightOf(g, seats)}</em></span>`).join('') +
        `<span class="st-spark-key"><i class="k-marker"></i>${T('st.spark_key_marker')}</span>`;

    const fastPicked = picked.filter((g) => FAST_MOVERS.indexOf(g) !== -1);
    sparkEl.innerHTML =
      `<div class="st-spark-head">${T('st.spark_title')}</div>
       ${sparkTabsHTML()}
       <div class="st-spark-body">
         <div class="st-spark-yaxis">${ticks.map((t) => `<span>${t}</span>`).join('')}</div>
         <div class="st-spark-plot">
           <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="st-spark-svg">
             ${grid}${paths}${marker}
           </svg>${badge}
         </div>
       </div>
       <div class="st-spark-xaxis">${xLabels}</div>
       <div class="st-spark-legend">${legend}</div>
       ${picker}
       <div class="st-note">${T('st.spark_y_label')}</div>
       ${sparkView === 'combined'
          ? `<div class="st-note">${T('st.spark_combined_note')}</div>
             <div class="st-note">${T('st.spark_smooth')}</div>`
          : ''}
       <div class="st-note">${T('st.spark_components')}</div>
       <div class="st-note">${T('st.spark_excl')}</div>
       <div class="st-note">${T('st.spark_note', { days: timeline.sample_days })}</div>
       ${fastPicked.length
          ? `<div class="st-note">${T('st.spark_fast', { planet: fastPicked.map(PN).join(', ') })}</div>` : ''}
       ${timeline.sample_days > 3 ? `<div class="st-note">${T('st.spark_alias')}</div>` : ''}`;
  }

  function sparkTabsHTML() {
    const tab = (v, key) =>
      `<button type="button" class="st-spark-tab${sparkView === v ? ' on' : ''}" data-spark-view="${v}"
               aria-pressed="${sparkView === v}">${T(key)}</button>`;
    return `<div class="st-spark-tabs">${tab('each', 'st.view_each')}${tab('combined', 'st.view_combined')}</div>`;
  }

  // The ticked grahas, each chip showing the seat it holds in this chain
  // and the weight that seat carries into the combined line.
  function grahaPickerHTML(seats) {
    const chips = ALL_GRAHAS.map((g) => {
      const on = sparkPicked.has(g);
      const seatIdx = period
        ? period.chain.findIndex((c) => PLANET_OF_LORD[c.label] === g) : -1;
      const role = seatIdx !== -1 ? I18N.term('dasha_level', period.chain[seatIdx].role) : '';
      return `<button type="button" class="st-graha-chip${on ? ' on' : ''}" data-graha="${g}"
                      aria-pressed="${on}" style="--chip:${lineColor(g)}">
                <i></i><span>${PN(g)}</span>
                <em>&times;${weightOf(g, seats)}</em>
                ${role ? `<small>${role}</small>` : ''}
              </button>`;
    }).join('');
    return `<div class="st-graha-picker">
              <div class="st-graha-picker-label">${T('st.pick_grahas')}</div>
              <div class="st-note st-chain-follows">${T('st.chain_follows')}</div>
              <div class="st-graha-chips">${chips}</div>
            </div>`;
  }

  // ── talking to the server ──
  async function loadTransit(exactDate, withTimeline) {
    const seq = ++reqSeq;
    busy = true;
    setStatus(T('st.loading'), 'st-busy');
    try {
      const body = Object.assign({}, BIRTH, {
        period_start: period.start,
        period_end: period.end,
        exact_date: exactDate,
        timeline: !!withTimeline,
      });
      const res = await fetch('/transit-positions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (seq !== reqSeq) return;               // a newer scrub already won
      if (!res.ok) { setStatus(T(data.error || 'st.err_generic'), 'st-error'); return; }
      if (withTimeline && data.timeline) timeline = data.timeline;
      transitPositions = data.exact.positions;
      transitDate = data.exact.date;
      applyTransit();
      setStatus('', '');
    } catch (e) {
      if (seq === reqSeq) setStatus(T('st.err_network'), 'st-error');
    } finally {
      if (seq === reqSeq) busy = false;
    }
  }

  function setStatus(text, cls) {
    if (!statusEl) return;
    statusEl.textContent = text;
    statusEl.className = 'st-status ' + (cls || '');
  }

  function applyTransit() {
    if (chartGochar && transitPositions) chartGochar.setPlacements(framed(transitPositions));
    renderSparkline();
    refreshHeader();
  }

  function applyNatal() {
    if (chartNatal) chartNatal.setPlacements(framed(NATAL));
  }

  // ── the period the user tapped ──
  function setPeriod(chain) {
    if (!chain || !chain.length) return;
    const last = chain[chain.length - 1];
    tappedChain = chain;
    // The tapped row fixes how far the slider reaches. Which lords are
    // running inside that span is then a question of the date, answered
    // on every move by refreshChain().
    period = { chain, start: last.start, end: last.end, depth: Math.max(chain.length, 3) };
    sparkPicked = null;   // re-defaults to this chain's lords on next draw
    const span = daysBetween(period.start, period.end);
    if (slider) {
      slider.min = 0;
      slider.max = Math.max(span, 0);
      slider.disabled = span <= 0;
    }
    if (dateInput) { dateInput.min = period.start; dateInput.max = period.end; }
    // Today when it falls inside the period, otherwise the midpoint - never
    // the start, which every sub-period shares with its parent.
    const today = new Date().toISOString().slice(0, 10);
    const start = (today >= period.start && today <= period.end)
      ? today : (span > 0 ? shiftDays(period.start, Math.round(span / 2)) : period.start);
    picksTouched = false;
    syncControls(start);
    timeline = null;
    loadTransit(start, true);
  }

  function syncControls(iso) {
    transitDate = iso;
    if (dateInput) dateInput.value = iso;
    if (slider && period) slider.value = daysBetween(period.start, iso);
    refreshChain();
    refreshHeader();
  }

  // Re-reads which dasha, bhukti and antara are running on the scrubbed
  // date. Until the reader touches a chip themselves, the ticked grahas
  // follow those lords, so dragging the slider walks the whole sequence.
  function refreshChain(){
    if (!period) return;
    const at = (typeof window.strengthChainAt === 'function')
      ? window.strengthChainAt(transitDate, period.depth) : null;
    period.chain = at && at.length ? at : (tappedChain || period.chain);
    if (!picksTouched) sparkPicked = defaultPicked();
  }

  function refreshHeader() {
    if (!periodEl) return;
    if (!period) { periodEl.innerHTML = `<span class="st-note">${T('st.no_period')}</span>`; return; }
    const crumbs = period.chain.map((c) =>
      `<span class="st-crumb"><span class="st-crumb-role">${I18N.term('dasha_level', c.role)}</span>${PN(PLANET_OF_LORD[c.label] || c.label)}</span>`
    ).join('<span class="st-crumb-sep">&rsaquo;</span>');
    periodEl.innerHTML =
      `<div class="st-crumbs">${crumbs}</div>
       <div class="st-range">${period.start} &rarr; ${period.end}${transitDate ? ` &middot; <b>${transitDate}</b>` : ''}</div>`;
  }

  // ── wiring ──
  if (slider) {
    slider.addEventListener('input', () => {
      if (!period) return;
      syncControls(clampDate(shiftDays(period.start, parseInt(slider.value, 10) || 0), period.start, period.end));
      renderSparkline();
    });
    // Only hit the server when the drag ends, not on every pixel.
    slider.addEventListener('change', () => { if (period) loadTransit(transitDate, false); });
  }
  if (dateInput) {
    dateInput.addEventListener('change', () => {
      if (!period || !dateInput.value) return;
      syncControls(clampDate(dateInput.value, period.start, period.end));
      loadTransit(transitDate, false);
    });
  }
  if (frameWrap) {
    frameWrap.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-st-frame]');
      if (!btn) return;
      frame = btn.dataset.stFrame;
      frameWrap.querySelectorAll('[data-st-frame]').forEach((b) =>
        b.setAttribute('aria-pressed', String(b.dataset.stFrame === frame)));
      applyNatal();
      applyTransit();
    });
  }
  panel.addEventListener('click', (e) => {
    if (e.target.closest('.st-reset')) {
      applyNatal();
      applyTransit();
      return;
    }
    const viewBtn = e.target.closest('[data-spark-view]');
    if (viewBtn) {
      sparkView = viewBtn.dataset.sparkView;
      renderSparkline();
      return;
    }
    const chip = e.target.closest('[data-graha]');
    if (chip) {
      if (!sparkPicked) sparkPicked = defaultPicked();
      picksTouched = true;
      const g = chip.dataset.graha;
      if (sparkPicked.has(g)) sparkPicked.delete(g); else sparkPicked.add(g);
      renderSparkline();
    }
  });

  // ── boot ──
  // panel-a / panel-b are the playground's own badge styles, reused.
  chartNatal = buildChart('st.chart_natal', 'panel-a');
  chartGochar = buildChart('st.chart_gochar', 'panel-b');
  applyNatal();
  refreshHeader();

  I18N.apply(panel);
  I18N.onChange(() => { refreshHeader(); renderSparkline(); renderCompare(); });

  // The dasha table on the Chart tab drives this panel.
  window.setStrengthPeriod = setPeriod;
})();
</script>
